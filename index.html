<html>
<head>
    <style>
        body { background: #222; overflow: hidden; transition: background 0.1s; }
        
        .game-button { 
            position: absolute; 
            padding: 10px 20px; 
            font-weight: bold; 
            border-radius: 5px; 
            border: 2px solid #000; 
            cursor: pointer;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .game-button:active { transform: scale(0.9); }

        @keyframes popIn { 
            0% { transform: scale(0); opacity: 0; } 
            80% { transform: scale(1.1); } 
            100% { transform: scale(1); opacity: 1; } 
        }

        #nuke-btn { 
            background: black !important; 
            color: red !important; 
            border: 4px solid red !important; 
            box-shadow: 0 0 20px red; 
            font-size: 24px; 
            z-index: 99999; 
            top: 40%; left: 45%; 
        }
    </style>
</head>
<body>
    <div id="button-container">
        <button class="game-button" style="top:50%; left:50%; background: #ff4757;" onclick="spawn(this)">CLICK ME</button>
    </div>

    <script>
        let buttonCount = 1;
        let clickCount = 0; 

        function spawn(clickedButton) {
            clickCount++; 
            
            clickedButton.style.opacity = "0.3";
            clickedButton.disabled = true;
            clickedButton.innerText = "DONE";

            
            if (clickCount % 50 === 0) {
                const nuke = document.createElement('button');
                nuke.id = 'nuke-btn';
                nuke.className = 'game-button';
                nuke.innerText = "NUKE";
                nuke.onclick = triggerNuke;
                document.getElementById('button-container').appendChild(nuke);
            }

            for (let i = 0; i < 2; i++) {
                buttonCount++;
                const newBtn = document.createElement('button');
                newBtn.className = 'game-button';
                
                const roll = Math.random() * 100;
                let color = '#555';
                let label = "CLICK ME";

                if (roll <= 0.5) {
                    color = '#ff00ff'; label = "RARE pink";
                    newBtn.style.boxShadow = "0 0 20px #ff00ff";
                    document.body.style.filter = "invert(100%)";
                    setTimeout(() => { document.body.style.filter = "none"; }, 100);
                } else if (roll <= 1.5) {
                    color = '#ffd700'; label = "RARE gold";
                    newBtn.style.border = "3px solid #fff";
                } else if (roll <= 6.5) {
                    color = '#c0c0c0'; label = "RARE silver";
                } else {
                    const commonColors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502'];
                    color = commonColors[Math.floor(Math.random() * commonColors.length)];
                }

                newBtn.style.backgroundColor = color;
                newBtn.innerText = label;
                newBtn.style.left = Math.random() * (window.innerWidth - 150) + 'px';
                newBtn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
                newBtn.style.zIndex = buttonCount;

                newBtn.onclick = function() { spawn(this); };
                document.getElementById('button-container').appendChild(newBtn);
            }
        }

        function triggerNuke(){
            const done = document.querySelectorAll('button:disabled');
            done.forEach(btn => btn.remove());
            
            document.body.style.backgroundColor = "white";
            setTimeout(() => { document.body.style.backgroundColor = "#222"; }, 100);
 const nuke = document.getElementById('nuke-btn');
     if(nuke) nuke.remove();
        }
    </script>
</body>
</html>
